[workspace]
members = ["crates/owly_cache", "crates/owly_core", "crates/owly_source", "crates/owly_types"]
resolver = "2"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
owly_core = { path = "crates/owly_core", version = "0.1.1" }
owly_cache = { path = "crates/owly_cache", version = "0.1.1" }
owly_types = { path = "crates/owly_types", version = "0.1.1" }
owly_source = { path = "crates/owly_source", version = "0.1.1" }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
semver = "1"
rusqlite = { version = "0.32", default-features = false, features = ["bundled"] }
walkdir = "2"

[package]
name = "owly"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "A linter for open-knowledge format LLM wikis."
license = "MIT"
repository = "https://github.com/edge-m/owly"
readme = "README.md"
keywords = ["wiki", "markdown", "linter", "llm", "knowledge"]
categories = ["command-line-utilities", "development-tools"]

[profile.dev]
codegen-units = 128

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[[bin]]
name = "owly"
path = "src/main.rs"

[dependencies]
chrono = { workspace = true }
clap = { workspace = true }
owly_core = { workspace = true }
owly_cache = { workspace = true }
owly_source = { workspace = true }
owly_types = { workspace = true }
indexmap = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
serde = { workspace = true }
semver = { workspace = true }
rusqlite = { workspace = true }

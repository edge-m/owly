[workspace]
members = ["crates/owly_core"]
resolver = "2"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
owly_core = { path = "crates/owly_core" }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
semver = "1"
walkdir = "2"

[package]
name = "owly"
version = "0.1.0"
edition = "2024"
description = "A linter for open-knowledge format LLM wikis."
license = "MIT"
repository = "https://github.com/edge-m/owly"

[profile.dev]
codegen-units = 128

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[[bin]]
name = "owly"
path = "src/main.rs"

[dependencies]
chrono = { workspace = true }
clap = { workspace = true }
owly_core = { workspace = true }
indexmap = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
serde = { workspace = true }
semver = { workspace = true }
